<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6ff">
  <title>数字パズル</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6ff;
      color: #20243a;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
    }
    main { width: min(100%, 440px); text-align: center; }
    .eyebrow { margin: 0 0 8px; color: #777e9b; font-size: .85rem; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 2.7rem); letter-spacing: .04em; }
    .subtitle { margin: 8px 0 24px; color: #737991; }
    .stats { display: flex; justify-content: center; gap: 12px; margin: 0 0 18px; }
    .stat { min-width: 116px; padding: 10px 16px; border: 1px solid #e6e9f5; border-radius: 16px; background: #fff; }
    .stat-label { display: block; color: #858ba3; font-size: .78rem; }
    .stat-value { display: block; margin-top: 2px; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(100%, 390px);
      aspect-ratio: 1;
      margin: 0 auto;
      padding: 10px;
      border-radius: 24px;
      background: #dfe4f5;
      box-shadow: 0 14px 36px #323d651a;
      touch-action: manipulation;
    }
    .tile, .empty { min-width: 0; border-radius: 17px; }
    .tile {
      border: 0;
      background: #fff;
      color: #4b56bd;
      box-shadow: 0 4px 0 #cbd0e5;
      font: inherit;
      font-size: clamp(1.7rem, 10vw, 2.7rem);
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s, background-color .12s;
    }
    .tile:active { transform: scale(.95); background: #f0f1ff; }
    .tile:focus-visible, .action:focus-visible { outline: 3px solid #7883ff; outline-offset: 3px; }
    .empty { background: #cfd5eb; }
    .message { min-height: 30px; margin: 17px 0 8px; color: #4b56bd; font-weight: 700; }
    .actions { display: flex; justify-content: center; gap: 10px; }
    .action { min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: #4b56bd; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .action.secondary { background: #e5e8f7; color: #454c76; }
    .hint { margin: 18px 0 0; color: #858ba3; font-size: .85rem; }
    @media (max-width: 360px) { .board { gap: 7px; padding: 7px; } .tile, .empty { border-radius: 13px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ちょっとひと息</p>
    <h1>数字パズル</h1>
    <p class="subtitle">数字をスライドして、1から順番に並べよう！</p>

    <section class="stats" aria-label="ゲームの記録">
      <div class="stat"><span class="stat-label">手数</span><span class="stat-value" id="moves">0</span></div>
      <div class="stat"><span class="stat-label">タイム</span><span class="stat-value" id="time">00:00</span></div>
    </section>

    <div class="board" id="board" role="group" aria-label="数字パズル盤面"></div>
    <p class="message" id="message" aria-live="polite">「シャッフル」を押してスタート！</p>
    <div class="actions">
      <button class="action" id="shuffle" type="button">シャッフル</button>
      <button class="action secondary" id="reset" type="button">やり直す</button>
    </div>
    <p class="hint">空いているマスのとなりの数字をタップ</p>
  </main>

  <script>
    (() => {
      const boardElement = document.querySelector('#board');
      const movesElement = document.querySelector('#moves');
      const timeElement = document.querySelector('#time');
      const messageElement = document.querySelector('#message');
      const solved = [1, 2, 3, 4, 5, 6, 7, 8, 0];
      let tiles = [...solved];
      let moves = 0;
      let startedAt = null;
      let timerId = null;
      let finished = false;

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
        const remainder = (seconds % 60).toString().padStart(2, '0');
        return `${minutes}:${remainder}`;
      }

      function render() {
        boardElement.replaceChildren();
        tiles.forEach((value, index) => {
          if (value === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.setAttribute('aria-hidden', 'true');
            boardElement.append(empty);
            return;
          }
          const button = document.createElement('button');
          button.className = 'tile';
          button.type = 'button';
          button.textContent = value;
          button.setAttribute('aria-label', `数字 ${value}`);
          button.addEventListener('click', () => moveTile(index));
          boardElement.append(button);
        });
      }

      function adjacent(a, b) {
        const sameRow = Math.floor(a / 3) === Math.floor(b / 3);
        return (sameRow && Math.abs(a - b) === 1) || Math.abs(a - b) === 3;
      }

      function moveTile(index) {
        if (finished) return;
        const emptyIndex = tiles.indexOf(0);
        if (!adjacent(index, emptyIndex)) return;
        if (startedAt === null) {
          startedAt = Date.now();
          timerId = window.setInterval(updateTime, 1000);
          messageElement.textContent = '';
        }
        [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
        moves += 1;
        movesElement.textContent = moves;
        render();
        if (tiles.every((value, i) => value === solved[i])) {
          finished = true;
          window.clearInterval(timerId);
          messageElement.textContent = `クリア！ ${moves}手・${timeElement.textContent}で完成！`;
        }
      }

      function updateTime() {
        if (startedAt !== null) {
          timeElement.textContent = formatTime(Math.floor((Date.now() - startedAt) / 1000));
        }
      }

      function resetStats(message = '「シャッフル」を押してスタート！') {
        window.clearInterval(timerId);
        timerId = null;
        startedAt = null;
        moves = 0;
        finished = false;
        movesElement.textContent = '0';
        timeElement.textContent = '00:00';
        messageElement.textContent = message;
      }

      function shuffle() {
        tiles = [...solved];
        let previousEmpty = -1;
        for (let step = 0; step < 120; step += 1) {
          const emptyIndex = tiles.indexOf(0);
          const choices = tiles
            .map((_, index) => index)
            .filter(index => adjacent(index, emptyIndex) && index !== previousEmpty);
          const nextIndex = choices[Math.floor(Math.random() * choices.length)];
          [tiles[nextIndex], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[nextIndex]];
          previousEmpty = emptyIndex;
        }
        if (tiles.every((value, i) => value === solved[i])) {
          [tiles[7], tiles[8]] = [tiles[8], tiles[7]];
        }
        resetStats('数字をタップして始めよう！');
        render();
      }

      document.querySelector('#shuffle').addEventListener('click', shuffle);
      document.querySelector('#reset').addEventListener('click', () => {
        tiles = [...solved];
        resetStats();
        render();
      });
      render();
    })();
  </script>
</body>
</html>
